# Configuración de Nginx para Flow (flow.javierjaenes.com)
# Proporciona terminación TLS/HTTPS con Let's Encrypt, HTTP/2 y compresión gzip.

# 1. Redirección HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name flow.javierjaenes.com;

    # Ruta para validación de certificados Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor HTTPS seguro
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flow.javierjaenes.com;

    # Certificados SSL (gestionados por Certbot)
    ssl_certificate /etc/letsencrypt/live/flow.javierjaenes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flow.javierjaenes.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cabeceras de seguridad estrictas (A+ en SSL Labs)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamaño máximo de subida (para restaurar copias de seguridad grandes)
    client_max_body_size 30M;

    # Optimización de compresión gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Proxy inverso hacia el contenedor Docker de Flow
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Cabeceras para que FastAPI reconozca la IP del cliente y el protocolo HTTPS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Soporte para WebSockets / SSE si se utilizasen
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts generosos para exportaciones y restauraciones de backups
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

