<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Fondo obsidian con profundidad -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151724"/>
      <stop offset="100%" stop-color="#0A0B10"/>
    </linearGradient>

    <!-- Gradiente Flow (Violeta eléctrico -> Cyan neón) -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Acento Esmeralda / Mint para saldo positivo -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Resplandor sutil -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Contenedor squircle con bordes suaves -->
  <rect x="4" y="4" width="120" height="120" rx="34" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  <rect x="4" y="4" width="120" height="120" rx="34" fill="url(#glow)"/>

  <!-- Símbolo "F" Flow Dinámico y Fluido -->
  <!-- Barra Superior -->
  <path d="M42 32 C38 32 34 35 34 40 L34 88 C34 92.5 37.5 96 42 96 C46.5 96 50 92.5 50 88 L50 68 L74 68 C78.5 68 82 64.5 82 60 C82 55.5 78.5 52 74 52 L50 52 L50 48 L88 48 C92.5 48 96 44.5 96 40 C96 35.5 92.5 32 88 32 Z" fill="url(#flowGrad)"/>

  <!-- Onda fluida esmeralda inferior (simboliza el flujo continuo de botes y ahorro) -->
  <path d="M58 84 C66 84 72 78 80 78 C85 78 89 80 92 83 C95 86 94 90 91 92 C87 95 82 96 76 96 C68 96 62 88 58 84 Z" fill="url(#mintGrad)"/>

  <!-- Punto de brillo cyan -->
  <circle cx="88" cy="40" r="4.5" fill="#38BDF8"/>
</svg>
