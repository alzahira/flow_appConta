<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#EEF0FB" />
  <title>Flow — Finanzas & Botes</title>
  
  <!-- Tipografía Inter & Plus Jakarta Sans con números tabulares -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=89" />
  <link rel="apple-touch-icon" href="/static/favicon.svg?v=89" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="stylesheet" href="/static/styles.css?v=89" />
  
  <!-- Inicialización inmediata de tema (archivo externo: CSP sin scripts inline) -->
  <script src="/static/js/theme-init.js?v=89"></script>
</head>
<body>
  <!-- Fondo con 3 manchas de degradado fijos de ~300px con blur(90-100px) y opacity .75 -->
  <div class="mesh-glow-bg" aria-hidden="true">
    <div class="glow-spot spot-lavender"></div>
    <div class="glow-spot spot-peach"></div>
    <div class="glow-spot spot-sky"></div>
  </div>

  <!-- Header Superior Minimalista de Cristal -->
  <header class="app-header glass-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo flow-logo-glass" aria-hidden="true" style="padding: 2px;">
          <img src="/static/favicon.svg?v=72" width="28" height="28" alt="Flow Logo" style="border-radius: 8px; display: block;" />
        </div>
        <div class="brand-text">
          <span class="brand-name">Flow</span>
          <span class="brand-sub">Finanzas</span>
        </div>
      </div>

      <!-- Contenedor dinámico para estado o conmutador de tema -->
      <div class="header-right-actions">
        <button type="button" class="btn-theme-quick-toggle" id="btn-theme-quick-toggle" title="Cambiar tema (Oscuro / Claro)" aria-label="Cambiar tema">
          <span class="theme-icon-dark">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </span>
          <span class="theme-icon-light">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
        </button>
        <button type="button" class="btn-header-logout" id="btn-header-logout" title="Cerrar sesión" aria-label="Cerrar sesión">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal de Vistas -->
  <main id="vista" class="app-content-container"></main>

  <!-- Barra de Navegación Inferior Flotante de Cristal -->
  <nav id="nav" class="floating-glass-nav" aria-label="Navegación principal"></nav>

  <!-- Modal y Drawer Backdrop Global -->
  <div class="nav-dropdown-backdrop" id="nav-dropdown-backdrop"></div>
  <div id="nav-sheet-portal"></div>

  <!-- Scripts -->
  <script src="/static/js/api.js?v=89"></script>
  <script type="module" src="/static/js/app.js?v=89"></script>
</body>
</html>
